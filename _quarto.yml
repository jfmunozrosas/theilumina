  open-graph: true
  twitter-card: true
  image: images/logo_theilumina.png
  back-to-top-navigation: true
  navbar:
    logo: images/logo_theilumina.png
    logo-alt: "THEILUMINA logo"
    title: false
    left:
      - href: index.qmd
        text: Home
      - text: Project
        menu:
          - href: research.qmd
            text: "Research problems and questions"
          - href: project.qmd
            text: "Objectives, work packages and activities"
          - href: news.qmd
            text: "Status and news"
      - href: team.qmd
        text: Team
      - text: Theil indices
        menu:
          - href: theil-indices.qmd
            text: "Definition and estimation"
          - href: simulation.qmd
            text: "Interactive bias explorer"
          - href: data-code.qmd
            text: "Research data and R code"
      - href: observatory.qmd
        text: Observatory
      - href: publications.qmd
        text: Publications
      - text: Dissemination
        menu:
          - href: dissemination.qmd
            text: "Seminars, conferences and stays"
          - href: identity.qmd
            text: "Logo and project identity"
          - href: links.qmd
            text: "Links of interest"
      - href: contact.qmd
