<!--
  Visit counter (GoatCounter, free and cookie-free).
  1. Create an account at https://www.goatcounter.com with the code below (theilumina).
  2. In Settings, enable "Allow adding visitor counts on your website".
  If the code "theilumina" is not available, change GC_CODE here (two places: this line and data-goatcounter).
-->
<script data-goatcounter="https://theilumina.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  const GC_CODE = "theilumina";
  function show(n) {
    const box = document.querySelector(".nav-footer-left") || document.querySelector("footer");
    if (!box || document.getElementById("visit-counter")) return;
    const s = document.createElement("span");
    s.id = "visit-counter";
    s.className = "visit-counter";
    s.innerHTML = ` · <span class="vc-num">${n}</span> visits`;
    box.appendChild(s);
  }
  // Skip local previews (quarto preview)
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return;
  fetch(`https://${GC_CODE}.goatcounter.com/counter/TOTAL.json`)
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.count) show(String(d.count).replace(/\s/g, ".")); })
    .catch(() => {});
})();
</script>
